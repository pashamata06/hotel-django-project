{% extends 'core/base.html' %}
{% block content %}
<div class="card">
    <h2>{{ news.title }}</h2>
    <p>{{ news.created_at|date:"d.m.Y" }}</p>
    {% if news.image %}<img src="{{ news.image.url }}" style="max-width:100%; max-height:300px;">{% endif %}
    <p>{{ news.content|linebreaks }}</p>
    <a href="{% url 'news_list' %}" class="btn">← Назад</a>
</div>
{% endblock %}
