{% extends 'core/base.html' %}
{% block content %}
<div class="card">
    <h2>Добавить промокод</h2>
    <form method="post">
        {% csrf_token %}
        <p><label>Код:</label> <input type="text" name="code" required></p>
        <p><label>Скидка %:</label> <input type="number" name="discount_percent" required></p>
        <p><label>Действует до:</label> <input type="date" name="valid_until" required></p>
        <button type="submit">Сохранить</button>
        <a href="{% url 'promocodes_list' %}" class="btn">Отмена</a>
    </form>
</div>
{% endblock %}
